name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 휴대폰 업로드로 폴더 구조가 사라진 경우 자동으로 제자리에 정리
      - name: Arrange project folders
        run: |
          J=app/src/main/java/com/bookscan/ai
          R=app/src/main/res
          mkdir -p $J $R/layout $R/values $R/drawable $R/mipmap-anydpi-v26
          mvif() { [ -f "$1" ] && mv -f "$1" "$2/" || true; }
          for f in *.kt; do mvif "$f" $J; done
          mvif AndroidManifest.xml app/src/main
          mvif proguard-rules.pro app
          for f in activity_main.xml dialog_preview.xml dialog_settings.xml item_page.xml; do mvif $f $R/layout; done
          mvif strings.xml $R/values
          mvif themes.xml $R/values
          mvif ic_launcher_fg.xml $R/drawable
          mvif ic_launcher.xml $R/mipmap-anydpi-v26
          rm -f build.gradle.kts app/build.gradle.kts

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.bookscan.ai"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.bookscan.ai"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint { abortOnError = false }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.activity:activity-ktx:1.9.3")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.exifinterface:exifinterface:1.3.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1")
              implementation("org.opencv:opencv:4.10.0")
          }
          EOF
          find . -path ./.git -prune -o -type f -print | sort

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AI-BookScan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AI-BookScan-apk
          path: AI-BookScan.apk
